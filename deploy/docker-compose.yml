name: open-design

services:
  open-design:
    container_name: open-design
    image: ${OPEN_DESIGN_IMAGE:-ghcr.io/nexu-io/od:latest}
    build:
      context: ..
      dockerfile: ${OPEN_DESIGN_DOCKERFILE:-deploy/Dockerfile}
      args:
        CODEX_VERSION: ${CODEX_VERSION:-latest}
    restart: always
    environment:
      NODE_ENV: production
      NODE_OPTIONS: ${NODE_OPTIONS:---max-old-space-size=192}
      OD_BIND_HOST: 0.0.0.0
      OD_ALLOWED_ORIGINS: ${OPEN_DESIGN_ALLOWED_ORIGINS:-}
      OD_PORT: 7456
      OD_WEB_PORT: ${OPEN_DESIGN_PORT:-7456}
      OD_API_TOKEN: ${OD_API_TOKEN:-}
      OD_DISABLE_API_AUTH: ${OPEN_DESIGN_DISABLE_API_AUTH:-}
      OD_CODEX_SANDBOX: ${OD_CODEX_SANDBOX:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      CODEX_HOME: /app/.codex
    ports:
      - "127.0.0.1:${OPEN_DESIGN_PORT:-7456}:7456"
    volumes:
      - open_design_data:/app/.od
      - codex_auth:/app/.codex
    read_only: true
    tmpfs:
      - /tmp
    # Codex workspace-write uses bubblewrap, which creates an unprivileged
    # user namespace. Docker's default seccomp/AppArmor policies and
    # no-new-privileges block that namespace even when the host kernel allows it.
    # SYS_ADMIN is limited to this service; the daemon still runs as the
    # unprivileged open-design user inside the container.
    security_opt:
      - apparmor=unconfined
      - seccomp=unconfined
    cap_add:
      - SYS_ADMIN
    mem_limit: ${OPEN_DESIGN_MEM_LIMIT:-384m}
    pids_limit: 256
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:7456/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

volumes:
  open_design_data:
  codex_auth:
